function render(){panel.replaceChildren();if(active===-1){panel.append(el('h2','home-heading','เลือกหมวดที่อยากเรียนรู้ ✨'));panel.append(el('p','hint','แตะหมวดที่ชอบเพื่อดูคำศัพท์ทั้งหมด'));const grid=el('div','category-grid');groups.forEach((g,i)=>{const b=el('button','category');b.type='button';const emoji=g[0].split(' ')[0];b.append(el('span','category-icon',emoji),el('span','category-name',g[0].replace(/^\S+\s/,'')),el('span','category-count',g[1].length+' คำ'));b.onclick=()=>enter(i);grid.append(b)});panel.append(grid);return}
const g=groups[active];const bar=el('div','lesson-top');const back=el('button','back','⌂ หมวดทั้งหมด');back.type='button';back.onclick=home;bar.append(back,el('span','lesson-count',g[1].length+' คำ'));panel.append(bar);panel.append(el('h2','lesson-heading',g[0]));panel.append(el('p','hint',isAdmin?'แตะภาพเพื่อฟังคำศัพท์ • ผู้ดูแลเพิ่มหรือเปลี่ยนรูปจริงได้ทุกคำ':'แตะภาพเพื่อฟังคำศัพท์ไทยและอังกฤษ'));const feedback=el('div','feedback','🔊 เลือกรูปที่อยากฟัง');panel.append(feedback);const grid=el('div','grid');g[1].forEach(a=>{const tile=el('div','tile');tile.setAttribute('role','button');tile.tabIndex=0;tile.setAttribute('aria-label','ฟัง '+a[1]+' '+a[2]);const key=keyFor(g,a);const visual=el('span','emoji','');const saved=imageCache[key]||photo[a[2]];if(saved){const img=document.createElement('img');img.src=saved;img.alt=a[1];visual.append(img)}else if(emojiUses[a[0]]===1){visual.textContent=a[0]}else{visual.className='photo-missing';visual.textContent='รอรูป '+a[1]}tile.append(visual,el('span','thai',a[1]),el('span','eng',a[2]));const upload=el('button','photo-add',saved?'📷 เปลี่ยนรูป':'＋ เพิ่มรูปจริง');upload.type='button';upload.setAttribute('aria-label',(saved?'เปลี่ยนรูป ':'เพิ่มรูป ')+a[1]);upload.hidden=!isAdmin;upload.onclick=ev=>{ev.stopPropagation();const input=document.createElement('input');input.type='file';input.accept='image/*';input.onchange=()=>{if(input.files&&input.files[0])saveImage(key,input.files[0])};input.click()};tile.append(upload);if(saved){const del=el('button','photo-add','ลบรูป');del.type='button';del.hidden=!isAdmin;del.setAttribute('aria-label','ลบรูป '+a[1]);del.onclick=ev=>{ev.stopPropagation();deleteImage(key)};tile.append(del)}tile.onclick=()=>{feedback.textContent='🔊 '+a[1]+' · '+a[2];play(a,tile)};tile.onkeydown=e=>{if(e.target===tile&&(e.key==='Enter'||e.key===' ')){e.preventDefault();tile.click()}};grid.append(tile)});panel.append(grid)}
initCloud();document.addEventListener('visibilitychange',()=>{if(document.hidden)stopPlayback()});try{render()}catch(err){panel.textContent='เปิดบทเรียนไม่สำเร็จ: '+err.message}
</script></body></html>
